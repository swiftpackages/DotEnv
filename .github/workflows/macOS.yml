name: macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    - name: Show Xcode toolchain
      run: |
        xcodebuild -version
        xcrun swift --version
    - name: Build
      run: xcrun swift build -v
    - name: Run tests
      run: xcrun swift test -v
